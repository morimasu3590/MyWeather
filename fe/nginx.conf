server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The app calls /api/*; forward it to the API container with /api stripped (the trailing slash in
    # proxy_pass does that), the same as the Vite dev proxy. Same origin for the browser, so no CORS.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts content-hashed files in /assets, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, which is never cached so new builds show up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
